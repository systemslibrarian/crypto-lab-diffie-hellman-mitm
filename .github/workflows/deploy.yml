name: Deploy to GitHub Pages

# One workflow, one gate. This lab used to split them: ci.yml ran the build, the
# engine tests and the scripted smoke + axe checks on pull_request and owned the
# Dependabot auto-merge, while this file ran the Playwright test suite
# (`npm run test:a11y`) on push to main. A bump never had to clear the
# Playwright suite to merge itself, so the deploy could fail on main with
# nothing red on the PR. Now `deploy` and `dependabot-auto-merge` need the same
# two gate jobs -- `build` (this file's old gate) and `verify` (ci.yml's, moved
# here verbatim) -- and ci.yml is gone.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # NOT a bare `pages`: with cancel-in-progress, a PR run would cancel a live
  # main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The engine suite (scripts/engine.test.mjs, 21 tests): authenticated
      # delivery failing closed on a tampered share, transcript binding
      # against misbinding, AES-GCM round-trip and tag rejection, Mallory's
      # intercept/rewrite path, and the preset primes. Deploy previously ran
      # only test:a11y, so a build where the MITM detection no longer
      # detected anything could ship as long as the page passed axe.
      - name: Engine unit tests
        run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Moved from ci.yml unchanged. Kept as its own job: it installs playwright and
  # axe-core with --no-save, which must not touch the tree the Pages artifact is
  # built from.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Engine unit tests
        run: npm test

      # Headless browser + a11y checks need a real Chromium and a running
      # preview server. Install Playwright + axe-core transiently, boot
      # `vite preview`, wait for the port, run smoke + axe, then tear down.
      - name: Install browser test deps
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium

      - name: Boot preview server
        run: |
          npx vite preview --port 4700 --strictPort &
          echo $! > preview.pid
          for i in $(seq 1 30); do
            if curl -fs http://localhost:4700/crypto-lab-diffie-hellman-mitm/ -o /dev/null; then
              echo "Preview ready"; exit 0
            fi
            sleep 1
          done
          echo "Preview failed to start within 30s"; exit 1

      - name: Smoke test (Playwright, 3 viewports)
        run: npm run smoke

      - name: Accessibility audit (axe-core, WCAG 2.1 A/AA)
        run: npm run axe

      - name: Stop preview
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)" || true
            rm preview.pid
          fi

  deploy:
    needs: [build, verify]
    # NOT `== 'push'`. That would also skip workflow_dispatch, which is the one
    # trigger the post-auto-merge deploy depends on: the dispatched run would
    # build, pass the gate, and skip this job, so the site would still never
    # update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: [build, verify]` is the whole safety argument -- a bump can
  # merge itself only once this lab's entire PR gate went green, so the gate
  # decides rather than the version number. A major that actually breaks the
  # lab fails the gate and the PR stays open for a human.
  dependabot-auto-merge:
    needs: [build, verify]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
