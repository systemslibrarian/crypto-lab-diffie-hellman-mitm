name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The engine suite (scripts/engine.test.mjs, 21 tests): authenticated
      # delivery failing closed on a tampered share, transcript binding
      # against misbinding, AES-GCM round-trip and tag rejection, Mallory's
      # intercept/rewrite path, and the preset primes. Deploy previously ran
      # only test:a11y, so a build where the MITM detection no longer
      # detected anything could ship as long as the page passed axe.
      - name: Engine unit tests
        run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
