name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check + build
        run: npm run build
      - name: Engine unit tests
        run: npm test

      # Headless browser + a11y checks need a real Chromium and a running
      # preview server. Install Playwright + axe-core transiently, boot
      # `vite preview`, wait for the port, run smoke + axe, then tear down.
      - name: Install browser test deps
        run: |
          npm install --no-save --no-audit --no-fund playwright axe-core
          npx playwright install --with-deps chromium

      - name: Boot preview server
        run: |
          npx vite preview --port 4700 --strictPort &
          echo $! > preview.pid
          for i in $(seq 1 30); do
            if curl -fs http://localhost:4700/crypto-lab-diffie-hellman-mitm/ -o /dev/null; then
              echo "Preview ready"; exit 0
            fi
            sleep 1
          done
          echo "Preview failed to start within 30s"; exit 1

      - name: Smoke test (Playwright, 3 viewports)
        run: npm run smoke

      - name: Accessibility audit (axe-core, WCAG 2.1 A/AA)
        run: npm run axe

      - name: Stop preview
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)" || true
            rm preview.pid
          fi

  # Dependabot only. Depends on every gate job in this workflow, so a bump can
  # only merge itself once this lab's whole PR gate went green. Majors are
  # excluded -- the 2026-08-18 batch had to hold back 109 bumps and they were
  # overwhelmingly majors (@noble v2 dropped export subpaths, TypeScript 7,
  # vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: verify
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Merge minor and patch bumps
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
